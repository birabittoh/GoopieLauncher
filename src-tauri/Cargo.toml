[package]
name = "goopie-launcher"
version = "1.7.4"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri         = { version = "2", features = ["tray-icon"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"

# Embed the static offline copy of GoopieWebsite into the binary at compile time
include_dir   = "0.7"

# Networking
reqwest       = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }

# XEX2 decryption + LZX decompression (title-image extraction)
aes           = "0.8"
lzxd          = "0.2"

# Hashing
sha2          = "0.10"
hex           = "0.4"

# Archive extraction (zip + tar.gz + 7z)
zip           = "2"
tar           = "0.4"
flate2        = "1"
sevenz-rust   = "0.6"

# Discord Rich Presence (IPC, no async runtime required)
discord-rich-presence = "1"

# Native dialogs (ISO file picker, folder picker)
rfd           = "0.15"

# Open URLs / folders in the system default application
open          = "5"

# Platform dirs (config, data, documents)
directories   = "5"

# ISO / XDVD filesystem extraction (pure-Rust, no sidecar needed)
# Use "sync" feature so all async fns become blocking calls — no tokio required.
xdvdfs        = { version = "0.8", default-features = false, features = ["std", "read", "sync"] }

# TOML parsing (achievement unlock-state files)
toml          = "0.8"

# Format-preserving TOML edits (per-game <recompname>.toml cvar config: keeps
# the shipped file's comments/blank-line grouping/key order intact while
# surgically updating only the launcher-managed keys). Pinned to 0.20 so the
# root document type is `Document` (renamed `DocumentMut` in 0.22+); this also
# matches the version `toml 0.8` already pulls in transitively, so it adds no
# extra crate to the dependency tree.
toml_edit     = "0.20"

# Base64 encoding (achievement icon data URLs delivered over the bridge)
base64        = "0.22"

# Image processing (cover art cropping for Steam grid)
image         = "0.25"

# CRC32 for Steam shortcut appid generation
crc32fast     = "1"

# Temp directories (drag-and-drop staging)
tempfile      = "3"

# Disk free-space queries
fs4           = "0.9"
tauri-plugin-single-instance = "2.4.3"

# Windows registry (config storage on Windows)
# Windows .lnk shortcut creation
[target.'cfg(windows)'.dependencies]
winreg        = "0.52"
junction      = "1"
mslnk         = "0.1"
windows-sys   = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging"] }
