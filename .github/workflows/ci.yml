name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha-short: ${{ steps.sha.outputs.short }}
      is-release: ${{ steps.tagcheck.outputs.is-release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: tagcheck
        run: |
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "is-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          fi

  build-website:
    needs: prepare
    if: needs.prepare.outputs.is-release != 'true'
    name: Build offline site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash ./scripts/build-offline-site.sh
      - uses: actions/upload-artifact@v4
        with:
          name: offline-site
          path: src-tauri/offline-site

  build-linux:
    needs: [prepare, build-website]
    if: needs.prepare.outputs.is-release != 'true'
    name: Build linux/x86_64
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.sha-short }}
      platform: linux
      arch: x86_64
      website-artifact: offline-site

  build-windows:
    needs: [prepare, build-website]
    if: needs.prepare.outputs.is-release != 'true'
    name: Build windows/x86_64
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.sha-short }}
      platform: windows
      arch: x86_64
      website-artifact: offline-site
