name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'linux' && 'ubuntu-24.04' || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux needs the same webkit/gtk system deps as the build to compile the
      # Tauri crate. The headless --self-update-check path never starts Tauri, so
      # no display (xvfb) is required to run the tests.
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            pkg-config

      # No GOOPIE_RELEASES_API / OAuth secrets needed: the releases API is
      # option_env! (compiles without it) and the e2e test supplies a local mock.
      - name: Run unit + end-to-end tests
        run: python run_tests.py
