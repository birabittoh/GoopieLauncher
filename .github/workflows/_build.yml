name: _build (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "Version string (short SHA or tag name)"
        type: string
        required: true
      platform:
        description: "Target platform: linux or windows"
        type: string
        required: true
      arch:
        description: "Target architecture: x86_64 or aarch64"
        type: string
        required: true
      versioned_filename:
        description: >-
          Embed the version in staged artifact filenames. CI builds keep it
          (the short SHA, to tell builds apart); release builds drop it so the
          published asset names are stable — the launcher self-updates them
          regardless of the version in the name.
        type: boolean
        required: false
        default: true
      website-artifact:
        description: >-
          Name of the uploaded artifact containing the pre-built offline site.
          When set, the build downloads it into src-tauri/offline-site/ and
          skips the beforeBuildCommand website build.
        type: string
        required: false
        default: ''
    secrets:
      GOOPIE_OAUTH_CLIENT_ID:
        description: "Google Desktop OAuth 2.0 client ID (public; baked into the binary at build time)"
        required: true
      GOOPIE_OAUTH_CLIENT_SECRET:
        description: "Google Desktop OAuth 2.0 client secret (public for Desktop apps; baked into the binary)"
        required: true

jobs:
  build:
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-24.04' || 'windows-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.website-artifact == '' && 'recursive' || 'false' }}

      - name: Setup Node.js
        if: inputs.website-artifact == ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── Rust toolchain ─────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Linux system dependencies ──────────────────────────────────────────
      - name: Install Linux system dependencies
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libjpeg-turbo8 \
            squashfs-tools \
            xvfb \
            patchelf \
            build-essential \
            libssl-dev \
            pkg-config

      # ── Tauri CLI ──────────────────────────────────────────────────────────
      - name: Install Tauri CLI (truly-portable-appimage branch)
        run: cargo install tauri-cli --git https://github.com/tauri-apps/tauri --branch feat/truly-portable-appimage --locked

      # ── Pre-built website (when provided by the caller) ────────────────────
      - name: Download pre-built offline site
        if: inputs.website-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.website-artifact }}
          path: src-tauri/offline-site

      # ── Tauri build ────────────────────────────────────────────────────────
      - name: Build (Linux)
        if: inputs.platform == 'linux'
        # .deb is intentionally not built — see "Stage/Upload .deb" below for why.
        # The new sharun-based AppImage format is enabled via the env var
        run: script -q -c "cargo tauri build --bundles appimage" /dev/null
        env:
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: "true"
          VERSION: ${{ inputs.version }}
          GOOPIE_OAUTH_CLIENT_ID: ${{ secrets.GOOPIE_OAUTH_CLIENT_ID }}
          GOOPIE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOPIE_OAUTH_CLIENT_SECRET }}
          GOOPIE_RELEASES_API: ${{ vars.GOOPIE_RELEASES_API }}
          GOOPIE_DISCORD_CLIENT_ID: ${{ vars.GOOPIE_DISCORD_CLIENT_ID }}

      # quick-sharun does not detect libjpeg.so.8 (WebKit subprocess dlopen
      # dep), so inject it into the built AppImage by extracting, adding the
      # missing library, and repacking.
      - name: Inject libjpeg.so.8 into AppImage
        if: inputs.platform == 'linux'
        shell: bash
        run: |
          set -eux
          APPIMAGE="$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)"
          cd "$(dirname "$APPIMAGE")"
          APPIMAGE_NAME="$(basename "$APPIMAGE")"

          # Locate the embedded squashfs by its magic bytes ("hsqs") rather
          # than trying to read a stored offset — AppImage doesn't keep one
          # in the last 8 bytes (that read garbage: dd then rejected it with
          # "cannot skip: Invalid argument").
          OFFSET=$(LC_ALL=C grep -a -b -o -m1 "hsqs" "./$APPIMAGE_NAME" | head -1 | cut -d: -f1)

          # Extract and unpack the squashfs portion. iflag=skip_bytes lets dd
          # skip an exact byte offset while still reading in large blocks
          # (bs=1 would mean byte-at-a-time I/O over a 100+MB file).
          dd if="./$APPIMAGE_NAME" of=image.squashfs bs=1M skip="$OFFSET" iflag=skip_bytes status=none
          unsquashfs -d squashfs-root image.squashfs

          # Copy the missing library next to the other WebKit shared libs
          # sharun already bundled — dropping it in a flat usr/lib instead
          # puts it outside the AppImage's LD_LIBRARY_PATH (sharun preserves
          # the original multiarch subdirectory, e.g. usr/lib/x86_64-linux-gnu),
          # so the WebKit subprocesses still couldn't find it at runtime.
          LIBDIR="$(dirname "$(find squashfs-root -name 'libwebkit2gtk-4.1.so*' | head -1)")"
          mkdir -p "$LIBDIR"
          cp /usr/lib/x86_64-linux-gnu/libjpeg.so.8 "$LIBDIR/"

          # Repack with the same compression
          mksquashfs squashfs-root/ new.squashfs -noappend -comp zstd

          # Extract the runtime stub and stitch everything back
          dd if="./$APPIMAGE_NAME" of=runtime bs=1M count="$OFFSET" iflag=count_bytes status=none
          cat runtime new.squashfs > "./$APPIMAGE_NAME"
          chmod +x "./$APPIMAGE_NAME"

          rm -rf squashfs-root/ runtime new.squashfs image.squashfs

      - name: Build (Windows)
        if: inputs.platform == 'windows'
        run: cargo tauri build --bundles nsis,msi
        env:
          VERSION: ${{ inputs.version }}
          GOOPIE_OAUTH_CLIENT_ID: ${{ secrets.GOOPIE_OAUTH_CLIENT_ID }}
          GOOPIE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOPIE_OAUTH_CLIENT_SECRET }}
          GOOPIE_RELEASES_API: ${{ vars.GOOPIE_RELEASES_API }}
          GOOPIE_DISCORD_CLIENT_ID: ${{ vars.GOOPIE_DISCORD_CLIENT_ID }}

      # ── Stage artifacts with consistent hyphenated names ───────────────────
      - name: Stage artifacts (Linux)
        if: inputs.platform == 'linux'
        run: |
          mkdir -p staged
          if [ "${{ inputs.versioned_filename }}" = "true" ]; then
            BASE="Goopie-Launcher-${{ inputs.version }}-linux-${{ inputs.arch }}"
          else
            BASE="Goopie-Launcher-linux-${{ inputs.arch }}"
          fi
          echo "ARTIFACT_BASE=$BASE" >> "$GITHUB_ENV"
          # .deb is not staged — the launcher can only self-update a single
          # portable executable/AppImage, and a dpkg-managed install can't be
          # replaced that way (root-owned path + package database).
          # cp src-tauri/target/release/bundle/deb/*.deb       "staged/${BASE}.deb"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "staged/${BASE}.AppImage"
          cp src-tauri/target/release/goopie-launcher "staged/${BASE}"

      - name: Stage artifacts (Windows)
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staged | Out-Null
          if ("${{ inputs.versioned_filename }}" -eq "true") {
            $base = "Goopie-Launcher-${{ inputs.version }}-windows-${{ inputs.arch }}"
          } else {
            $base = "Goopie-Launcher-windows-${{ inputs.arch }}"
          }
          "ARTIFACT_BASE=$base" | Out-File -FilePath $env:GITHUB_ENV -Append
          $exe  = Get-ChildItem src-tauri/target/release/*.exe | Select-Object -First 1
          $msi  = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName  "staged/$base.exe"
          Copy-Item $msi.FullName  "staged/$base.msi"
          Copy-Item $nsis.FullName "staged/$base-setup.exe"

      # ── Artifact upload (one artifact per bundle type) ─────────────────────
      # .deb is no longer built/published — see "Stage artifacts (Linux)" above.
      # - name: Upload .deb
      #   if: inputs.platform == 'linux'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: Goopie-Launcher-${{ inputs.version }}-linux-${{ inputs.arch }}-deb
      #     path: staged/*.deb

      - name: Upload .AppImage
        if: inputs.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: Goopie-Launcher-${{ inputs.version }}-linux-${{ inputs.arch }}-appimage
          path: staged/*.AppImage

      - name: Upload portable binary
        if: inputs.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: Goopie-Launcher-${{ inputs.version }}-linux-${{ inputs.arch }}-portable
          path: staged/${{ env.ARTIFACT_BASE }}

      - name: Upload .msi
        if: inputs.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Goopie-Launcher-${{ inputs.version }}-windows-${{ inputs.arch }}-msi
          path: staged/*.msi

      - name: Upload .exe (NSIS)
        if: inputs.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Goopie-Launcher-${{ inputs.version }}-windows-${{ inputs.arch }}-nsis
          path: staged/*-setup.exe

      - name: Upload portable .exe
        if: inputs.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Goopie-Launcher-${{ inputs.version }}-windows-${{ inputs.arch }}-portable
          path: staged/${{ env.ARTIFACT_BASE }}.exe
