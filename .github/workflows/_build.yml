name: _build (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "Version string (short SHA or tag name)"
        type: string
        required: true
      platform:
        description: "Target platform: linux or windows"
        type: string
        required: true
      arch:
        description: "Target architecture: x86_64 or aarch64"
        type: string
        required: true
    outputs:
      artifact-name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-22.04' || 'windows-latest' }}
    outputs:
      artifact-name: ${{ steps.artifact-name.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Rust toolchain ─────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Linux system dependencies ──────────────────────────────────────────
      - name: Install Linux system dependencies
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            pkg-config

      # ── Tauri CLI ──────────────────────────────────────────────────────────
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      # ── Tauri build ────────────────────────────────────────────────────────
      - name: Build (Linux)
        if: inputs.platform == 'linux'
        run: cargo tauri build --bundles deb,appimage
        env:
          VERSION: ${{ inputs.version }}

      - name: Build (Windows)
        if: inputs.platform == 'windows'
        run: cargo tauri build --bundles nsis,msi
        env:
          VERSION: ${{ inputs.version }}

      # ── Artifact naming and upload ─────────────────────────────────────────
      - name: Set artifact name
        id: artifact-name
        shell: bash
        run: |
          echo "name=Goopie-Launcher-${{ inputs.version }}-${{ inputs.platform }}-${{ inputs.arch }}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (Linux)
        if: inputs.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload artifact (Windows)
        if: inputs.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
