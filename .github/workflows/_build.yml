name: _build (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "Version string (short SHA or tag name)"
        type: string
        required: true
      platform:
        description: "Target platform: linux or windows"
        type: string
        required: true
      arch:
        description: "Target architecture: x86_64 or aarch64"
        type: string
        required: true
      versioned_filename:
        description: >-
          Embed the version in staged artifact filenames. CI builds keep it
          (the short SHA, to tell builds apart); release builds drop it so the
          published asset names are stable — the launcher self-updates them
          regardless of the version in the name.
        type: boolean
        required: false
        default: true
      website-artifact:
        description: >-
          Name of the uploaded artifact containing the pre-built offline site.
          When set, the build downloads it into src-tauri/offline-site/ and
          skips the beforeBuildCommand website build.
        type: string
        required: false
        default: ''
    secrets:
      GOOPIE_OAUTH_CLIENT_ID:
        description: "Google Desktop OAuth 2.0 client ID (public; baked into the binary at build time)"
        required: true
      GOOPIE_OAUTH_CLIENT_SECRET:
        description: "Google Desktop OAuth 2.0 client secret (public for Desktop apps; baked into the binary)"
        required: true

jobs:
  build:
    runs-on: ${{ inputs.platform == 'linux' && (inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04') || 'windows-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.website-artifact == '' && 'recursive' || 'false' }}

      - name: Setup Node.js
        if: inputs.website-artifact == ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── Rust toolchain ─────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Linux system dependencies ──────────────────────────────────────────
      - name: Install Linux system dependencies
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libjpeg-turbo8 \
            libicu74 \
            xvfb \
            patchelf \
            build-essential \
            libssl-dev \
            pkg-config

      # ── Tauri CLI ──────────────────────────────────────────────────────────
      # Pinned to a specific commit on the feat/truly-portable-appimage
      # branch (rather than tracking the branch tip) so upstream pushes
      # can't silently change the build — that's exactly how AppRun.sh
      # regressed and broke every AppImage on hosts without system
      # webkit2gtk (Steam Deck etc.) without a single line changing here.
      # Bump deliberately and re-test when picking up upstream fixes.
      - name: Install Tauri CLI (truly-portable-appimage branch)
        run: cargo install tauri-cli --git https://github.com/tauri-apps/tauri --rev 503bdbc1eade37d50a64ea7f81dbe853338b7fda --locked

      # ── Pre-built website (when provided by the caller) ────────────────────
      - name: Download pre-built offline site
        if: inputs.website-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.website-artifact }}
          path: src-tauri/offline-site

      # ── Tauri build ────────────────────────────────────────────────────────
      - name: Build (Linux)
        if: inputs.platform == 'linux'
        # .deb is intentionally not built — see "Stage/Upload .deb" below for why.
        # The new sharun-based AppImage format is enabled via the env var
        run: script -q -c "cargo tauri build --bundles appimage" /dev/null
        env:
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: "true"
          VERSION: ${{ inputs.version }}
          GOOPIE_OAUTH_CLIENT_ID: ${{ secrets.GOOPIE_OAUTH_CLIENT_ID }}
          GOOPIE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOPIE_OAUTH_CLIENT_SECRET }}
          GOOPIE_RELEASES_API: ${{ vars.GOOPIE_RELEASES_API }}
          GOOPIE_DISCORD_CLIENT_ID: ${{ vars.GOOPIE_DISCORD_CLIENT_ID }}

      # quick-sharun misses some of WebKit's runtime-only deps (dlopen'd
      # image loaders, ICU, libxml2, etc. — seen so far: libjpeg.so.8,
      # libicudata/i18n/uc.so.74, libxml2.so.2), so detect whatever is
      # actually missing from the WebKit subprocess binaries and inject it
      # into the built AppImage by extracting, adding the missing libraries,
      # and repacking.
      #
      # There's a second, independent bug on top of that: the WebKit*Process
      # binaries are plain copies of the system webkit2gtk helper executables
      # and carry neither an RPATH nor a patched interpreter. quick-sharun's
      # own LD_LIBRARY_PATH plumbing only covers the *main* process (it execs
      # goopie-launcher via an explicit `ld-linux --library-path` invocation,
      # never setting a real env var), so it's invisible to anything WebKit
      # forks internally — those helpers fall through to the *host's* system
      # libraries entirely. That's fine as long as the host happens to ship
      # compatible libs (which is how this went unnoticed), but breaks the
      # moment the host's version drifts (e.g. the host's ICU major version
      # moved on from the one this WebKit build needs), and it's the reason
      # bundling one missing library was never sufficient on its own.
      # Confirmed by hand: patchelf'ing an RPATH onto the WebKit*Process
      # binaries fixes *direct* deps, but DT_RUNPATH (patchelf's default)
      # doesn't apply to transitive deps (e.g. libxml2 needed by
      # libwebkit2gtk, not by WebKitWebProcess itself) — needs classic
      # DT_RPATH (`--force-rpath`). And once transitive deps resolve into the
      # bundle, the loader also picks up the bundle's own libc.so.6 (since
      # RPATH is now searched process-wide), which is incompatible with the
      # *host's* dynamic loader still in charge (WebKit's helpers keep their
      # original system PT_INTERP) — "undefined symbol: __nptl_change_stack_perm,
      # version GLIBC_PRIVATE". So the helpers also need their PT_INTERP
      # repointed at the bundled ld-linux-x86-64.so.2 to match the bundled
      # libc. PT_INTERP is resolved directly by the kernel with no $ORIGIN or
      # env-var expansion, so it can't reference the AppImage's mount path,
      # which only exists at run time and changes per launch. quick-sharun
      # already solves exactly this class of problem for other hardcoded
      # paths it finds (see the `*.hook` files it drops in bin/, which
      # symlink a fixed /tmp/<token> to $APPDIR/lib et al. at every launch) —
      # so this step adds its own hook using the same trick, and points
      # PT_INTERP at that fixed, stable /tmp path instead of depending on
      # quick-sharun's own (randomly-named, may not always exist) tokens.
      #
      # The three earlier attempts at the "extract, patch, repack" mechanics
      # (see git log) all assumed the payload was a squashfs image and tried
      # to locate/unpack it by hand (a stored offset, a magic-byte search,
      # the ELF section-header math) — every one failed with an
      # invalid-superblock error. The bundler (tauri-apps/tauri's
      # feat/truly-portable-appimage branch) actually runs pkgforge-dev's
      # quick-sharun.sh, which packs the AppDir with pkgforge-dev's own
      # `appimagetool`: that tool embeds a DwarFS image (not squashfs) behind
      # the `uruntime` runtime. So there was never a squashfs superblock to
      # find. uruntime is format-agnostic from the outside: `--appimage-extract`
      # extracts either backing format to ./squashfs-root (name kept for
      # AppImageKit compat), so let the AppImage extract itself instead of
      # reimplementing that. Repacking goes through the same appimagetool
      # quick-sharun.sh uses, which re-embeds whichever format it was built
      # to use.
      - name: Inject missing shared libraries into AppImage
        if: inputs.platform == 'linux'
        shell: bash
        run: |
          set -eux
          # Multiarch lib dir differs per runner (x86_64-linux-gnu on
          # ubuntu-24.04, aarch64-linux-gnu on ubuntu-24.04-arm) — resolve it
          # instead of hardcoding, so the host-lib lookups below work on both.
          MULTIARCH="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          APPIMAGE="$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)"
          ORIG_DIR="$(cd "$(dirname "$APPIMAGE")" && pwd)"
          ORIG_NAME="$(basename "$APPIMAGE")"

          # productName has a space in it ("Goopie Launcher"), so the raw
          # bundled AppImage filename does too. Work on a space-free copy:
          # uruntime's --appimage-extract silently produced an empty
          # ./squashfs-root (100% progress, zero files) when invoked against
          # the space-containing path — consistent with the sort of thing
          # that breaks when a small tool's internal glue does unquoted
          # argv[0]/$0 handling.
          WORKDIR="$RUNNER_TEMP/appimage-inject"
          mkdir -p "$WORKDIR"
          APPIMAGE_NAME="goopie-launcher.AppImage"
          cp "$ORIG_DIR/$ORIG_NAME" "$WORKDIR/$APPIMAGE_NAME"
          cd "$WORKDIR"
          chmod +x "./$APPIMAGE_NAME"

          "./$APPIMAGE_NAME" --appimage-extract

          if [ ! -d squashfs-root ] || [ -z "$(find -H squashfs-root -mindepth 1 -print -quit)" ]; then
            echo "::error::--appimage-extract produced no (or an empty) ./squashfs-root; contents of cwd:"
            find . -maxdepth 3
            exit 1
          fi

          # Missing libraries go next to the other WebKit shared libs sharun
          # already bundled (a flat lib/, not a multiarch usr/lib/<arch>/
          # subdir, despite what earlier revisions of this step assumed).
          # quick-sharun.sh is fetched from its upstream main branch on every
          # build (not pinned), so its output layout can drift between runs —
          # dump the whole tree on any mismatch instead of silently
          # constructing bogus empty paths (see git history for what that
          # looks like: a "Permission denied" writing to filesystem root).
          WEBKIT_SO="$(find -H squashfs-root -name 'libwebkit2gtk-4.1.so*' | head -1)"
          if [ -z "$WEBKIT_SO" ]; then
            echo "::error::Could not find libwebkit2gtk-4.1.so* anywhere under squashfs-root; full tree:"
            find -H squashfs-root
            exit 1
          fi
          LIBDIR="$(dirname "$WEBKIT_SO")"
          mkdir -p "$LIBDIR"

          WEBKIT_BINS="$(find -H squashfs-root -path '*webkit2gtk-4.1/WebKit*Process')"
          if [ -z "$WEBKIT_BINS" ]; then
            echo "::error::Could not find any WebKit*Process binaries under squashfs-root; full tree:"
            find -H squashfs-root
            exit 1
          fi

          # Ask the WebKit subprocess binaries themselves what they're still
          # missing (via ldd) instead of hardcoding one library name at a
          # time. `cp -L` dereferences the host's soname symlink so the AppDir
          # gets the real file, not a symlink that would dangle inside it.
          for BIN in $WEBKIT_BINS; do
            while read -r MISSING_LIB; do
              [ -n "$MISSING_LIB" ] || continue
              [ -e "$LIBDIR/$MISSING_LIB" ] && continue
              HOST_PATH="$(find "/usr/lib/$MULTIARCH" "/lib/$MULTIARCH" -name "$MISSING_LIB" 2>/dev/null | head -1)"
              if [ -z "$HOST_PATH" ]; then
                echo "::error::Could not find $MISSING_LIB on the host to inject into the AppImage"
                exit 1
              fi
              cp -L "$HOST_PATH" "$LIBDIR/$MISSING_LIB"
            done < <(ldd "$BIN" | awk '/not found/ {print $1}')
          done

          # libappindicator-sys loads its library via dlopen(), not a regular
          # ELF dependency, so it never shows up as "not found" in the ldd
          # scan above and the main binary's own transitive deps (already
          # bundled by quick-sharun) never pull it in either. Inject it by
          # hand, trying both the Ayatana and legacy sonames since
          # libappindicator-sys falls back between them at runtime.
          for LIB in libayatana-appindicator3.so.1 libappindicator3.so.1; do
            [ -e "$LIBDIR/$LIB" ] && continue
            HOST_PATH="$(find "/usr/lib/$MULTIARCH" "/lib/$MULTIARCH" -name "$LIB" 2>/dev/null | head -1)"
            [ -n "$HOST_PATH" ] && cp -L "$HOST_PATH" "$LIBDIR/$LIB"
          done
          if [ ! -e "$LIBDIR/libayatana-appindicator3.so.1" ] && [ ! -e "$LIBDIR/libappindicator3.so.1" ]; then
            echo "::error::Could not find libayatana-appindicator3.so.1 or libappindicator3.so.1 on the host to inject into the AppImage"
            exit 1
          fi

          # Fixed token (namespaced to avoid clashing with quick-sharun's own
          # hook tokens) that a launch-time hook resolves to $APPDIR/lib, so
          # PT_INTERP below has a stable path to point at across runs/mounts.
          WEBKIT_LIB_TOKEN="goopie-webkit-lib"
          HOOK_DIR="$(find -H squashfs-root -maxdepth 1 -type d -name bin | head -1)"
          if [ -z "$HOOK_DIR" ]; then
            echo "::error::Could not find a bin/ dir under squashfs-root to drop the launch hook in; full tree:"
            find -H squashfs-root
            exit 1
          fi
          printf '%s\n' "LC_ALL=C ln -sfn \"\$APPDIR\"/lib /tmp/$WEBKIT_LIB_TOKEN || :" \
            > "$HOOK_DIR/00-goopie-webkit-libpath.hook"
          chmod +x "$HOOK_DIR/00-goopie-webkit-libpath.hook"

          # quick-sharun bundles GIO's GnuTLS backend module
          # (lib/gio/modules/libgiognutls.so, needed for HTTPS requests) but
          # nothing tells GIO to look in $APPDIR/lib/gio/modules for it — GIO
          # only searches its own compiled-in default module directory
          # (a path baked into the bundled libgio-2.0.so.0 at its own build
          # time), which doesn't exist on the running host. Without a TLS
          # backend, WebKitNetworkProcess can't make HTTPS requests at all,
          # so the window loads blank with a "TLS support is not available"
          # warning — reproduced by hand: unset, the warning fires; with
          # GIO_EXTRA_MODULES pointed at the bundled dir, it doesn't.
          #
          # GIO_MODULE_DIR (not GIO_EXTRA_MODULES) is used here: _EXTRA_MODULES
          # only *adds* the bundled dir as an extra search path, it doesn't stop
          # GIO from also still scanning its compiled-in default host directory
          # (/usr/lib/<arch>/gio/modules). That's a problem because GIO dlopens
          # every module it finds there, unconditionally, at startup — including
          # ones the launcher never uses (network-proxy detection, gvfs). Those
          # host modules are compiled against whatever GLib the *host* currently
          # has; the bundled GTK/GLib loaded via RPATH is a different, frozen
          # version, so a host update (e.g. PikaOS bumping glib/gvfs) can leave
          # them ABI-incompatible with the bundled GLib actually in the process
          # ("undefined symbol: g_variant_builder_init_static" from
          # libgvfscommon.so, "Failed to load module: libgiolibproxy.so") and
          # take the whole process down. GIO_MODULE_DIR fully replaces the
          # search path instead of adding to it, so only the modules quick-sharun
          # actually bundled (matching the bundled GLib) ever get loaded.
          printf '%s\n' 'export GIO_MODULE_DIR="$APPDIR"/lib/gio/modules' \
            > "$HOOK_DIR/00-goopie-gio-modules.hook"
          chmod +x "$HOOK_DIR/00-goopie-gio-modules.hook"

          # Same class of bug, different subsystem: gdk-pixbuf loaders (used to
          # render icons, including GTK's own icon-theme fallback icons) are
          # dlopen'd by module name from a directory path baked into the
          # bundled libgdk_pixbuf-2.0.so.0 at its own build time
          # (/usr/lib/<arch>/gdk-pixbuf-2.0/2.10.0/loaders on the CI runner).
          # Like the GIO modules above, quick-sharun doesn't bundle these
          # (dlopen'd, not a regular ELF dependency, so invisible to the ldd
          # scan), so at runtime the bundled gdk-pixbuf reaches out to the
          # *host's* loader directory and dlopens whatever it finds there.
          # After a host update those loaders (e.g. the SVG loader, which
          # wraps librsvg) can be linked against a librsvg/glib ABI the
          # bundled gdk-pixbuf doesn't match — "undefined symbol:
          # rsvg_handle_get_pixbuf_and_error" — which GTK's icon helper
          # (gtkiconhelper.c) treats as a fatal GError and aborts the process.
          # Fix: bundle the loaders themselves plus a loaders.cache generated
          # against them, and point GDK_PIXBUF_MODULE_FILE at the bundled
          # cache so gdk-pixbuf never consults the host directory at all.
          # The cache stores absolute paths to each loader .so, resolved at
          # cache-generation time — since that's a build-time path that won't
          # exist at run time, rewrite it to the same stable /tmp token used
          # for PT_INTERP above (backed by the ln -sfn hook), which always
          # resolves to $APPDIR/lib regardless of where the AppImage mounts.
          PIXBUF_LOADER_DIR="$(find "/usr/lib/$MULTIARCH" "/lib/$MULTIARCH" -type d -path '*gdk-pixbuf-2.0/*/loaders' 2>/dev/null | head -1)"
          if [ -z "$PIXBUF_LOADER_DIR" ]; then
            echo "::error::Could not find a gdk-pixbuf loaders directory on the host to bundle"
            exit 1
          fi
          PIXBUF_VERSION_DIR="$(basename "$(dirname "$PIXBUF_LOADER_DIR")")"
          BUNDLED_PIXBUF_DIR="$LIBDIR/gdk-pixbuf-2.0/$PIXBUF_VERSION_DIR/loaders"
          mkdir -p "$BUNDLED_PIXBUF_DIR"
          cp -L "$PIXBUF_LOADER_DIR"/*.so "$BUNDLED_PIXBUF_DIR/"

          GDK_PIXBUF_QUERY_LOADERS="$(command -v gdk-pixbuf-query-loaders || find "/usr/lib/$MULTIARCH" "/usr/bin" -maxdepth 3 -name 'gdk-pixbuf-query-loaders*' 2>/dev/null | head -1)"
          if [ -z "$GDK_PIXBUF_QUERY_LOADERS" ]; then
            echo "::error::Could not find gdk-pixbuf-query-loaders on the host runner"
            exit 1
          fi
          RUNTIME_PIXBUF_DIR="/tmp/$WEBKIT_LIB_TOKEN/gdk-pixbuf-2.0/$PIXBUF_VERSION_DIR/loaders"
          "$GDK_PIXBUF_QUERY_LOADERS" "$BUNDLED_PIXBUF_DIR"/*.so \
            | sed "s|$BUNDLED_PIXBUF_DIR|$RUNTIME_PIXBUF_DIR|g" \
            > "$BUNDLED_PIXBUF_DIR/../loaders.cache"

          printf '%s\n' 'export GDK_PIXBUF_MODULE_FILE="$APPDIR"'"/lib/gdk-pixbuf-2.0/$PIXBUF_VERSION_DIR/loaders.cache" \
            > "$HOOK_DIR/00-goopie-pixbuf-loaders.hook"
          chmod +x "$HOOK_DIR/00-goopie-pixbuf-loaders.hook"

          for BIN in $WEBKIT_BINS; do
            patchelf --set-interpreter "/tmp/$WEBKIT_LIB_TOKEN/ld-linux-x86-64.so.2" "$BIN"
            patchelf --force-rpath --set-rpath '$ORIGIN/..' "$BIN"
          done

          # bin/goopie-launcher itself has the exact same problem as the
          # WebKit*Process helpers above: it carries neither an RPATH nor a
          # patched interpreter, so it depends entirely on AppRun launching
          # it through the bundled loader with $APPDIR/lib on the library
          # path. AppRun.sh (fetched unpinned from upstream quick-sharun, see
          # the block comment above) no longer does that — it just execs the
          # binary directly — so on any host that doesn't already have a
          # matching system libwebkit2gtk-4.1 (Steam Deck, most non-Ubuntu
          # distros) the launcher fails immediately with "cannot open shared
          # object file: libwebkit2gtk-4.1.so.0". This previously went
          # unnoticed because GitHub's ubuntu-24.04 runner happens to already
          # have compatible system libs, so the host loader "accidentally"
          # resolved everything even without any of this bundle-aware
          # patching. Fix it the same way as the WebKit helpers: point
          # PT_INTERP at the bundled loader (via the same stable /tmp token)
          # and give it an RPATH back to $APPDIR/lib, so it no longer depends
          # on how AppRun happens to invoke it.
          MAIN_BIN="$(find -H squashfs-root/bin -maxdepth 1 -type f -name goopie-launcher | head -1)"
          if [ -z "$MAIN_BIN" ]; then
            echo "::error::Could not find bin/goopie-launcher under squashfs-root; full tree:"
            find -H squashfs-root
            exit 1
          fi
          patchelf --set-interpreter "/tmp/$WEBKIT_LIB_TOKEN/ld-linux-x86-64.so.2" "$MAIN_BIN"
          patchelf --force-rpath --set-rpath '$ORIGIN/../lib' "$MAIN_BIN"

          # Pinned to a specific release (not /releases/latest) for the same
          # reason the Tauri CLI install above is pinned to a commit — an
          # upstream appimagetool release could otherwise silently change
          # how the AppImage gets repacked. Bump deliberately and re-test.
          ARCH="$(uname -m)"
          APPIMAGETOOL_VERSION="0.3.2"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool"
          if [ ! -x "$APPIMAGETOOL" ]; then
            curl -Lso "$APPIMAGETOOL" "https://github.com/pkgforge-dev/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${ARCH}-linux"
            chmod +x "$APPIMAGETOOL"
          fi

          rm -f "./$APPIMAGE_NAME"
          "$APPIMAGETOOL" squashfs-root -o . -n "$APPIMAGE_NAME"
          chmod +x "./$APPIMAGE_NAME"

          # Copy the patched AppImage back over the original (space-containing)
          # name/location so the later "Stage artifacts (Linux)" step finds it.
          cp "./$APPIMAGE_NAME" "$ORIG_DIR/$ORIG_NAME"
          chmod +x "$ORIG_DIR/$ORIG_NAME"

          rm -rf "$WORKDIR"

      - name: Build (Windows)
        if: inputs.platform == 'windows'
        run: cargo tauri build --bundles nsis,msi
        env:
          VERSION: ${{ inputs.version }}
          GOOPIE_OAUTH_CLIENT_ID: ${{ secrets.GOOPIE_OAUTH_CLIENT_ID }}
          GOOPIE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOPIE_OAUTH_CLIENT_SECRET }}
          GOOPIE_RELEASES_API: ${{ vars.GOOPIE_RELEASES_API }}
          GOOPIE_DISCORD_CLIENT_ID: ${{ vars.GOOPIE_DISCORD_CLIENT_ID }}

      # ── Stage artifacts with consistent hyphenated names ───────────────────
      - name: Stage artifacts (Linux)
        if: inputs.platform == 'linux'
        run: |
          mkdir -p staged
          if [ "${{ inputs.versioned_filename }}" = "true" ]; then
            BASE="Goopie-Launcher-${{ inputs.version }}-linux-${{ inputs.arch }}"
          else
            BASE="Goopie-Launcher-linux-${{ inputs.arch }}"
          fi
          echo "ARTIFACT_BASE=$BASE" >> "$GITHUB_ENV"
          # .deb is not staged — the launcher can only self-update a single
          # portable executable/AppImage, and a dpkg-managed install can't be
          # replaced that way (root-owned path + package database).
          # cp src-tauri/target/release/bundle/deb/*.deb       "staged/${BASE}.deb"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "staged/${BASE}.AppImage"
          cp src-tauri/target/release/goopie-launcher "staged/${BASE}"

      - name: Stage artifacts (Windows)
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staged | Out-Null
          if ("${{ inputs.versioned_filename }}" -eq "true") {
            $base = "Goopie-Launcher-${{ inputs.version }}-windows-${{ inputs.arch }}"
          } else {
            $base = "Goopie-Launcher-windows-${{ inputs.arch }}"
          }
          "ARTIFACT_BASE=$base" | Out-File -FilePath $env:GITHUB_ENV -Append
          $exe  = Get-ChildItem src-tauri/target/release/*.exe | Select-Object -First 1
          $msi  = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName  "staged/$base.exe"
          Copy-Item $msi.FullName  "staged/$base.msi"
          Copy-Item $nsis.FullName "staged/$base-setup.exe"

      # ── Artifact upload (one artifact per bundle type) ─────────────────────
      # .deb is no longer built/published — see "Stage artifacts (Linux)" above.
      # - name: Upload .deb
      #   if: inputs.platform == 'linux'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: Goopie-Launcher-${{ inputs.version }}-linux-${{ inputs.arch }}-deb
      #     path: staged/*.deb

      - name: Upload .AppImage
        if: inputs.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: Goopie-Launcher-${{ inputs.version }}-linux-${{ inputs.arch }}-appimage
          path: staged/*.AppImage

      - name: Upload portable binary
        if: inputs.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: Goopie-Launcher-${{ inputs.version }}-linux-${{ inputs.arch }}-portable
          path: staged/${{ env.ARTIFACT_BASE }}

      - name: Upload .msi
        if: inputs.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Goopie-Launcher-${{ inputs.version }}-windows-${{ inputs.arch }}-msi
          path: staged/*.msi

      - name: Upload .exe (NSIS)
        if: inputs.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Goopie-Launcher-${{ inputs.version }}-windows-${{ inputs.arch }}-nsis
          path: staged/*-setup.exe

      - name: Upload portable .exe
        if: inputs.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
