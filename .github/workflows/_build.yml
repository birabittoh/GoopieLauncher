name: _build (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "Version string (short SHA or tag name)"
        type: string
        required: true
      platform:
        description: "Target platform: linux or windows"
        type: string
        required: true
      arch:
        description: "Target architecture: x86_64 or aarch64"
        type: string
        required: true
    secrets:
      GOOPIE_OAUTH_CLIENT_ID:
        description: "Google Desktop OAuth 2.0 client ID (public; baked into the binary at build time)"
        required: true
      GOOPIE_OAUTH_CLIENT_SECRET:
        description: "Google Desktop OAuth 2.0 client secret (public for Desktop apps; baked into the binary)"
        required: true

jobs:
  build:
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-22.04' || 'windows-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed to vendor the GoopieWebsite submodule for the embedded
          # offline site (built by scripts/build-offline-site.sh, wired into
          # `cargo tauri build` via tauri.conf.json's beforeBuildCommand).
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── Rust toolchain ─────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Linux system dependencies ──────────────────────────────────────────
      - name: Install Linux system dependencies
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            pkg-config

      # ── Tauri CLI ──────────────────────────────────────────────────────────
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      # ── Tauri build ────────────────────────────────────────────────────────
      - name: Build (Linux)
        if: inputs.platform == 'linux'
        # .deb is intentionally not built — see "Stage/Upload .deb" below for why.
        run: cargo tauri build --bundles appimage
        env:
          VERSION: ${{ inputs.version }}
          GOOPIE_OAUTH_CLIENT_ID: ${{ secrets.GOOPIE_OAUTH_CLIENT_ID }}
          GOOPIE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOPIE_OAUTH_CLIENT_SECRET }}
          GOOPIE_RELEASES_API: ${{ vars.GOOPIE_RELEASES_API }}

      - name: Build (Windows)
        if: inputs.platform == 'windows'
        run: cargo tauri build --bundles nsis,msi
        env:
          VERSION: ${{ inputs.version }}
          GOOPIE_OAUTH_CLIENT_ID: ${{ secrets.GOOPIE_OAUTH_CLIENT_ID }}
          GOOPIE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOPIE_OAUTH_CLIENT_SECRET }}
          GOOPIE_RELEASES_API: ${{ vars.GOOPIE_RELEASES_API }}

      # ── Stage artifacts with consistent hyphenated names ───────────────────
      - name: Stage artifacts (Linux)
        if: inputs.platform == 'linux'
        run: |
          mkdir -p staged
          BASE="Goopie-Launcher-${{ inputs.version }}-linux-${{ inputs.arch }}"
          # .deb is not staged — the launcher can only self-update a single
          # portable executable/AppImage, and a dpkg-managed install can't be
          # replaced that way (root-owned path + package database).
          # cp src-tauri/target/release/bundle/deb/*.deb       "staged/${BASE}.deb"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "staged/${BASE}.AppImage"

      - name: Stage artifacts (Windows)
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staged | Out-Null
          $base = "Goopie-Launcher-${{ inputs.version }}-windows-${{ inputs.arch }}"
          $exe  = Get-ChildItem src-tauri/target/release/*.exe | Select-Object -First 1
          $msi  = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName  "staged/$base.exe"
          Copy-Item $msi.FullName  "staged/$base.msi"
          Copy-Item $nsis.FullName "staged/$base-setup.exe"

      # ── Artifact upload (one artifact per bundle type) ─────────────────────
      # .deb is no longer built/published — see "Stage artifacts (Linux)" above.
      # - name: Upload .deb
      #   if: inputs.platform == 'linux'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: Goopie-Launcher-${{ inputs.version }}-linux-${{ inputs.arch }}-deb
      #     path: staged/*.deb

      - name: Upload .AppImage
        if: inputs.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: Goopie-Launcher-${{ inputs.version }}-linux-${{ inputs.arch }}-appimage
          path: staged/*.AppImage

      - name: Upload .msi
        if: inputs.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Goopie-Launcher-${{ inputs.version }}-windows-${{ inputs.arch }}-msi
          path: staged/*.msi

      - name: Upload .exe (NSIS)
        if: inputs.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Goopie-Launcher-${{ inputs.version }}-windows-${{ inputs.arch }}-nsis
          path: staged/*-setup.exe

      - name: Upload portable .exe
        if: inputs.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Goopie-Launcher-${{ inputs.version }}-windows-${{ inputs.arch }}-portable
          path: staged/Goopie-Launcher-${{ inputs.version }}-windows-${{ inputs.arch }}.exe
