name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify-version:
    name: Verify version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check package.json, Cargo.toml, Cargo.lock, tauri.conf.json, metainfo.xml match tag
        run: |
          TAG="${{ github.ref_name }}"
          EXPECTED="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(grep -m1 -E '^version\s*=' src-tauri/Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          LOCK=$(grep -A1 -m1 'name = "goopie-launcher"' src-tauri/Cargo.lock | grep version | sed -E 's/version *= *"([^"]+)"/\1/')
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          METAINFO=$(grep -m1 -E '<release\s+version=' packaging/flatpak/xyz.goopie.launcher.metainfo.xml | sed -E 's/.*version="([^"]+)".*/\1/')

          echo "Tag version:      $EXPECTED"
          echo "package.json:     $PKG"
          echo "Cargo.toml:       $CARGO"
          echo "Cargo.lock:       $LOCK"
          echo "tauri.conf.json:  $TAURI"
          echo "metainfo.xml:     $METAINFO"

          if [ "$PKG" != "$EXPECTED" ] || [ "$CARGO" != "$EXPECTED" ] || [ "$LOCK" != "$EXPECTED" ] || [ "$TAURI" != "$EXPECTED" ] || [ "$METAINFO" != "$EXPECTED" ]; then
            echo "::error::Version mismatch — package.json, Cargo.toml, Cargo.lock, tauri.conf.json, and metainfo.xml must all be bumped to $EXPECTED (use set-version.py)"
            exit 1
          fi

  build-website:
    name: Build offline site
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash ./scripts/build-offline-site.sh
      - uses: actions/upload-artifact@v4
        with:
          name: offline-site
          path: src-tauri/offline-site

  build-linux:
    needs: build-website
    name: Build linux/x86_64
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
      platform: linux
      arch: x86_64
      # Published assets are versionless — the launcher self-updates regardless.
      versioned_filename: false
      website-artifact: offline-site

  build-linux-arm64:
    needs: build-website
    name: Build linux/aarch64
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
      platform: linux
      arch: aarch64
      # Published assets are versionless — the launcher self-updates regardless.
      versioned_filename: false
      website-artifact: offline-site

  build-windows:
    needs: build-website
    name: Build windows/x86_64
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
      platform: windows
      arch: x86_64
      versioned_filename: false
      website-artifact: offline-site

  flatpak:
    needs: build-linux
    name: Package flatpak/x86_64
    uses: ./.github/workflows/_flatpak.yml
    with:
      version: ${{ github.ref_name }}
      arch: x86_64
      binary-artifact: Goopie-Launcher-${{ github.ref_name }}-linux-x86_64-portable
      bundle-name: Goopie-Launcher-linux-x86_64.flatpak

  flatpak-arm64:
    needs: build-linux-arm64
    name: Package flatpak/aarch64
    uses: ./.github/workflows/_flatpak.yml
    with:
      version: ${{ github.ref_name }}
      arch: aarch64
      binary-artifact: Goopie-Launcher-${{ github.ref_name }}-linux-aarch64-portable
      bundle-name: Goopie-Launcher-linux-aarch64.flatpak

  flatpak-repo:
    name: Publish Flatpak repo to Pages
    needs: [flatpak, flatpak-arm64]
    # A called workflow can't request more than its caller grants, so the
    # permissions _flatpak-publish.yml needs are declared here too.
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/_flatpak-publish.yml

  release:
    name: Create GitHub Release
    needs: [build-linux, build-linux-arm64, build-windows, flatpak-repo]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Goopie Launcher ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.flatpak
            artifacts/**/*.flatpakref
            artifacts/**/*-portable/*
            artifacts/**/*.msi
            artifacts/**/*.exe
          generate_release_notes: true
