name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify-version:
    name: Verify version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check package.json, Cargo.toml, Cargo.lock, tauri.conf.json match tag
        run: |
          TAG="${{ github.ref_name }}"
          EXPECTED="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(grep -m1 -E '^version\s*=' src-tauri/Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          LOCK=$(grep -A1 -m1 'name = "goopie-launcher"' src-tauri/Cargo.lock | grep version | sed -E 's/version *= *"([^"]+)"/\1/')
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")

          echo "Tag version:      $EXPECTED"
          echo "package.json:     $PKG"
          echo "Cargo.toml:       $CARGO"
          echo "Cargo.lock:       $LOCK"
          echo "tauri.conf.json:  $TAURI"

          if [ "$PKG" != "$EXPECTED" ] || [ "$CARGO" != "$EXPECTED" ] || [ "$LOCK" != "$EXPECTED" ] || [ "$TAURI" != "$EXPECTED" ]; then
            echo "::error::Version mismatch — package.json, Cargo.toml, Cargo.lock, and tauri.conf.json must all be bumped to $EXPECTED (use set-version.py)"
            exit 1
          fi

  build-website:
    name: Build offline site
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash ./scripts/build-offline-site.sh
      - uses: actions/upload-artifact@v4
        with:
          name: offline-site
          path: src-tauri/offline-site

  build-linux:
    needs: build-website
    name: Build linux/x86_64
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
      platform: linux
      arch: x86_64
      # Published assets are versionless — the launcher self-updates regardless.
      versioned_filename: false
      website-artifact: offline-site

  build-windows:
    needs: build-website
    name: Build windows/x86_64
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
      platform: windows
      arch: x86_64
      versioned_filename: false
      website-artifact: offline-site

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Goopie Launcher ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*-portable/*
            artifacts/**/*.msi
            artifacts/**/*.exe
          generate_release_notes: true
