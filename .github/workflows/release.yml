name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-website:
    name: Build offline site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash ./scripts/build-offline-site.sh
      - uses: actions/upload-artifact@v4
        with:
          name: offline-site
          path: src-tauri/offline-site

  build-linux:
    needs: build-website
    name: Build linux/x86_64
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
      platform: linux
      arch: x86_64
      # Published assets are versionless — the launcher self-updates regardless.
      versioned_filename: false
      website-artifact: offline-site

  build-windows:
    needs: build-website
    name: Build windows/x86_64
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
      platform: windows
      arch: x86_64
      versioned_filename: false
      website-artifact: offline-site

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Goopie Launcher ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*-portable/*
            artifacts/**/*.msi
            artifacts/**/*.exe
          generate_release_notes: true
